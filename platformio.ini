; paperOS — firmware for the M5Stack PaperDIY
;
; Layout:
;   src/                  firmware entry point + M5Stack hardware glue
;   lib/paperos-core/     hardware-independent OS core (input, shell, app API)
;   apps/<name>/          one folder per app, each a self-contained library
;   test/                 host-side unit tests for the core (pio test -e native)

[platformio]
default_envs = paperdiy

[env]
lib_extra_dirs = apps
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall

; ---------------------------------------------------------------------------
; M5Stack PaperDIY: ESP32-S3-WROOM-1-N16R8 (16 MB flash, 8 MB octal PSRAM),
; 4.7" 960x540 16-level greyscale e-paper.
; Board detection, e-paper power (M5PM1) and the A/B buttons are handled by
; M5Unified/M5GFX, which support the PaperDIY from M5Unified 0.2.29 / M5GFX 0.2.36.
; ---------------------------------------------------------------------------
[env:paperdiy]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; The e-paper driver needs octal (OPI) PSRAM for its frame buffer.
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.36
    https://github.com/m5stack/M5Unified.git#0.2.29

; Host build used for unit tests of the core and apps: `pio test -e native`
[env:native]
platform = native
test_build_src = no
