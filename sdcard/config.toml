# paperOS configuration.
# Copy this file to the root of the PaperDIY's SD card as /config.toml.

[owner]
  name = "Dan"

# Switch off after this many minutes without a button press, leaving a random
# image from /wallpapers on the screen. Double press the power button to do
# this straight away; press it once to wake. 0 never sleeps on its own.
[power]
  sleep_minutes = 10

# Used for the calendar and the clock. A name such as "Europe/Berlin" or
# "America/New_York", or a POSIX TZ rule such as "CET-1CEST,M3.5.0,M10.5.0/3".
[time]
  timezone = "UTC"

# The Wi-Fi network used to download calendars and set the clock.
# [wifi]
#   ssid = "MyNetwork"
#   password = "secret"

[calendar]
  days = 14             # how many days ahead to show
  refresh_minutes = 60  # how often to download again while the app is open

# One [[calendar.feed]] per calendar, using its secret iCal (.ics) address.
# This example is a public holiday calendar, so it works once [wifi] is set.
[[calendar.feed]]
  name = "Holidays"
  url = "https://calendar.google.com/calendar/ical/en.uk%23holiday%40group.v.calendar.google.com/public/basic.ics"

# [[calendar.feed]]
#   name = "Personal"
#   url = "https://calendar.google.com/calendar/ical/.../basic.ics"
#
# [[calendar.feed]]
#   name = "Work"
#   url = "webcal://outlook.office365.com/owa/calendar/.../calendar.ics"

# A WebDAV or CalDAV folder to sync files with, such as a Nextcloud folder.
# For Tasks, use the same folder, username and password as Mindwtr's WebDAV
# sync. Open Settings > Sync to check the sign-in works. Use an https:// address.
# [sync]
#   url = "https://cloud.example.com/remote.php/dav/files/dan/mindwtr/"
#   username = "dan"
#   password = "app-password"

# Tasks shows Mindwtr's data.json from the [sync] folder.
[tasks]
  days = 7              # how far ahead Upcoming looks
  refresh_minutes = 15  # how often to download again while the app is open

# Settings for working on paperOS.
# [Developer]
#   debug = "true"   # save log messages to /debug.0.log (then debug.1.log, ...) and
#                    # show technical detail when something fails, such as why Wi-Fi didn't connect
