# paperOS configuration.
# Copy this file to the root of the PaperDIY's SD card as /config.toml.

[owner]
  name = "Dan"

# Used for the calendar and the clock. A name such as "Europe/Berlin" or
# "America/New_York", or a POSIX TZ rule such as "CET-1CEST,M3.5.0,M10.5.0/3".
[time]
  timezone = "UTC"

# The Wi-Fi network used to download calendars and set the clock.
# [wifi]
#   ssid = "MyNetwork"
#   password = "secret"

[calendar]
  days = 14             # how many days ahead to show
  refresh_minutes = 60  # how often to download again while the app is open

# One [[calendar.feed]] per calendar, using its secret iCal (.ics) address.
# This example is a public holiday calendar, so it works once [wifi] is set.
[[calendar.feed]]
  name = "Holidays"
  url = "https://calendar.google.com/calendar/ical/en.uk%23holiday%40group.v.calendar.google.com/public/basic.ics"

